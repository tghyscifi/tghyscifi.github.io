essay_list:
  - content: |
      为 Waline 评论系统试遍了几乎所有的云服务和数据库方案，最后发现官网评论区有人开源了一站式方案。🤡
      无所谓，就当服务关停后的备用计划了。
    date: 2026-09-01 14:20:32
    from: 瞳观幻域

  - content: |
      正在自律写闪哈2观后感中，少话，，，
      很久没写东西后重拾写作，发现文风变成熟了些，赘余的结构被优化了，但用词依然多有不得意之处。
      等有时间了要像训AI一样大量喂语料，现在读的内容大多都是工科的技术文档，容易过拟合。
      今天顺便给博客的音乐播放器换了API，现在可以爽听网易的VIP歌曲了。
    date: 2026-08-29 21:38:05
    from: 瞳观幻域

  - content: |
      突然意识到自己好久没更新博客了。
      前段时间一直在忙宿舍搬家的事，紧接着又是夏季学期的课程，终于回到了那种每天都在忙但不知在忙什么的生活。
      忙里偷闲看完了闪哈2，预计要出一个观后感，连带着还有对[《率月纪元》](https://tghyscifi.github.io/posts/ratomoondp/)正传旧稿的锐评。
      这里贴一个实践课的整活，学钳工急头白脸锯半天做出的尤物。
    date: 2026-08-21 23:05:06
    from: 瞳观幻域
    image:
      - assets/images/illus/essay/milkyfrog.webp

  - content: |
      终于把正式版做出来了。Google 自带的Agent是真的拉胯，搭配 dsv4f 日常左右脑互搏。
    date: 2026-08-15 13:00:45
    from: 瞳观幻域
    
  - content: |
      为溯月馆做了一个安卓 APP，在首页目录中点击 APP 即可下载。
      vibe coding 真是神了，一行代码不写，全程用 Android Studio 的 harness 带 dsv4f 轻轻松松把需求转化为成品。
    date: 2026-08-13 13:41:35
    from: 瞳观幻域

  - content: |
      突然感觉这个动态功能的定位有点尴尬：
      的确存在发这种小段随想的需求，但发在动态页几乎没人会去看，毕竟博客没有推送。
      较长的随想以博客的形式发出来，更让动态的功能显得多余。
      合理的方案是让动态能显示在首页，但不分配单独的页面，直接在首页展示全文。同时动态页面仅用于归档所有的动态。
      但这样需要AI爆改代码，搞不好又要鸡飞狗跳。
      所以还是算了吧。
    date: 2026-08-11 20:05:57
    from: 瞳观幻域

  - content: |
      整理了建站经验，希望能帮到未来的某个沙雕网友。
      发现学cs的同学中有博客的人挺少的，可能现在已经不流行这玩意了吧。
    date: 2026-08-08 20:22:10
    from: 瞳观幻域

  - content: |
      今天网站正式上线了，为了不至于闲置，把很久之前的旧稿都清了出来。
      已经很久没有写点东西了，正在艰难复健中。
