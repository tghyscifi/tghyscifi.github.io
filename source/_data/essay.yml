  - content: |
      突然感觉这个动态功能的定位有点尴尬：
      的确存在发这种小段随想的需求，但发在动态页几乎没人会去看，毕竟博客没有推送。
      较长的随想以博客的形式发出来，更让动态的功能显得多余。
      合理的方案是让动态能显示在首页，但不分配单独的页面，直接在首页展示全文。同时动态页面仅用于归档所有的动态。
      但这样需要AI爆改代码，搞不好又要鸡飞狗跳。
      所以还是算了吧。
    date: 2026-08-11 20:05:57
    from: 瞳观幻域
