essay_list:
  - content: |
      查 QQbot 教程顺带刷到几个相当漂亮的二次元主题博客，一番研究后发现用的是[Astro](https://astro.build/)框架的[Shirone](https://astro.build/themes/details/shirone/)模板。
      仔细一研究发现无论是框架本身还是模板的设计都完胜之前用的[Hexo](https://hexo.io/)+[Meow](https://meow.jumaoo.top/)的组合，遂决定把整个网站迁移过去。
      这个周末将会很疯狂。
      这一番折腾下来得到的最重要的经验就是自己用AI爆改不如直接复用别人现成的。
    date: 2026:10:22 12:55:45
    from: 瞳观幻域
  - content: |
      感觉最近有点过于依赖 AI 了，学习能力严重退化。
      也许问题的本质是依赖程度还不够，或者 token 额度不够。（你清一年一千块还是太少了）
      这一问题应该会在未来一年得到缓解。
      [DeepSeek V4.1 Flash 大规模推理部署实践](https://zhuanlan.zhihu.com/p/2095560295930508953)
    date: 2026-10-21 17:36:19
    from: 瞳观幻域
  - content: |
      心血来潮想做个 QQ 机器人玩玩，发现官方居然做了[dsh](https://github.com/deepseek-ai/deepseek-harness)的[插件](https://github.com/tencent-connect/dsh-qqbot)。
      那就很轮椅了，只要在我现有的dsh环境下安装并配好这个插件，就可以把大肥鱼接到QQ里了。
      然而实践证明 QQBot 的配置比想象中更复杂，如果只是想把 dsh 接到 QQ ，那扫个码就完事了。但这时的bot继承了本地的 preset，也就是说它本地 agent 的完全权限，开放出去等于自杀。
      以及我想给它注入普瑞赛斯的人设，服务粥群的群友，这就需要一番打磨。
      没想到第一次开发智能体是在这种情境下，过程中也积累了不少经验，刚好作为下一次更新的选题（预估周末发布）。
    date: 2026-10-20 15:54:35
    from: 瞳观幻域
  - content: |
      今天让 GPT 给我做了网站的英文页面，但目前只翻译了页面的控件文本，文章还没翻。
      因为文章的翻译本质是在为小说写英译本，虽然目前我的这些废稿并不值得如此大费周章，但在这个过程中把一些术语概念的英文版确定下来也是很有必要的。
      ……我似乎低估了工作量，也高估了自己对英语的理解。以后再说吧。
    date: 2026-10-17 17:14:48
    from: 瞳观幻域
  - content: |
      近期与一些同学交流，一种新思想正在我的脑中酝酿。
      常理来讲，我的想法可以分为三类：第一类经过细思才知道很弱智，根本不可能实现；第二类确实有一定价值，但早就有人在做或已做得很完善了；第三类是暂时无法被明确归为以上两种之一，但终将成为两者之一的。
      目前只能将其归入第三类。
      不过，发展这一思想，也意味着我要在一定程度上背离先前的路线，想必要与一些同志就此分道扬镳。但我相信，既然大方向一致，那么终有相逢的一天。
      我需要一些时日将这一想法沉淀为完备的理论，预计将在寒假动笔，形成一篇正式的文章，不，应该算是小册子吧。
      目前，我称该理论为“工程社会主义”。
    date: 2026-10-01 21:16:46
    from: 瞳观幻域
  - content: |
      我只是开学了，并不是死了。
      不过确实有段时间没打理博客了。小学期做了个奶茶机器人项目，但太唐了没好意思放出来。
      讲西方文学的老师是一位宽容而富有激情的老先生，显然过着幸福的精神生活，因而多少向同学们传达了这种如今已很难想象的气氛。但可惜前两节课讲的是希腊神话，遂刷一下午论文。
    date: 2026-09-22 16:49:24
    from: 瞳观幻域
  - content: |
      因为一些偶然的因素选了西方文学思潮与作品这门课（更多是出于刷取学分的需要），然后拿到了一张大概这辈子都不会去看的书单。
      有一些甚至是那种会被煞有介事地列入名著丛书，作为中小学教育的拓展推销给家长，小时候从未感兴趣过的熟悉著作。
      似乎又在冗余的铺垫上白费了笔墨，总之，在选购了两本后，意外得到了作为赠品的第三本书。虽说也在大概这辈子都不会去看的书之列，但稍微能引起一些猎奇的兴趣。
      相见恨晚。
      或者说，要是早个几年读到的话，可能会少在一些不必要的迷惘中浪费时间。不过，能在那种东西那里获得共鸣，自己也真是个神人啊。（
