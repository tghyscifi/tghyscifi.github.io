name: Pages

on:
  push:
    branches:
      - master
  release:
    types: [published]
  workflow_dispatch:

# Ensure build+deploy runs serialize, no matter which trigger fires
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive
          # Reuse the latest blog code even when triggered by a release tag
          ref: ${{ github.event_name == 'release' && 'master' || github.ref }}
      - name: Use Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: "26.3.1"
      - name: Cache NPM dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.OS }}-npm-cache-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.OS }}-npm-cache
      - name: Install Dependencies
        run: npm install
      - name: Build Hexo
        run: |
          npm install -g hexo-cli   # 关键：全局安装 hexo-cli
          hexo clean
          hexo generate             # 直接运行，不需要 npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4